[package]
name = "simpleclipboard"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Reliable system clipboard integration for Vim"
repository = "https://github.com/beamiter/simpleclipboard"
publish = false

[lib]
name = "simpleclipboard"
crate-type = ["cdylib", "rlib"]
path = "src/simpleclipboard/simpleclipboard_lib.rs"

[[bin]]
name = "simpleclipboard-daemon"
path = "src/simpleclipboard/simpleclipboard_daemon.rs"

# The out-of-process transport: one daemon request per process.  That is the
# only shape a Get reply fits, since libcallnr() can return nothing but a
# number, and the only shape an editor can watch asynchronously instead of
# blocking its UI thread for the whole request deadline.  It is built,
# installed and usable from a shell, but the plugin does not drive it yet:
# every copy still goes through the synchronous libcallnr() entry points.
[[bin]]
name = "simpleclipboard-client"
path = "src/simpleclipboard/simpleclipboard_client.rs"

[dependencies]
aes-gcm = "0.11"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
getrandom = "0.4.3"
libc = "0.2.186"
log = "0.4"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# No `panic = "abort"` here, unlike the rest of the simple* suite.  This crate
# also builds a cdylib that Vim loads into its own process with libcallnr(), so
# aborting on a Rust panic would take the user's editor down with it — losing
# unsaved buffers over a failed clipboard write.  Unwinding keeps the panic
# inside the FFI boundary, where the entry points turn it into an error return.
