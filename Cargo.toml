[package]
name = "simpleclipboard"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Reliable system clipboard integration for Vim"
repository = "https://github.com/beamiter/simpleclipboard"
publish = false

[lib]
name = "simpleclipboard"
crate-type = ["cdylib", "rlib"]
path = "src/simpleclipboard/simpleclipboard_lib.rs"

[[bin]]
name = "simpleclipboard-daemon"
path = "src/simpleclipboard/simpleclipboard_daemon.rs"

[dependencies]
aes-gcm = "0.11"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
getrandom = "0.4.3"
libc = "0.2.186"
log = "0.4"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
